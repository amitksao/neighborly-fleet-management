server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Flutter web uses hash-based or path-based routing.
    # This ensures deep links (e.g. /fleet/dashboard) serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively (Flutter build outputs content-hashed filenames)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|woff|woff2|ttf|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Do not cache index.html so the app shell is always fresh
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;
}
