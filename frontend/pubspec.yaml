name: neighborly_fleet
description: Neighborly Fleet Manager — standalone app for fleet operators.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Networking
  http: ^1.2.0

  # Storage
  shared_preferences: ^2.3.0

  # DI
  get_it: ^7.7.0

  # Utilities
  intl: ^0.20.2
  url_launcher: ^6.3.0

  # Push notifications
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
